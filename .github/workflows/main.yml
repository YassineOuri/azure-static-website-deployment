name: CI with OpenID Connect

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v1

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/




  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      # Checkout Code
      - uses: actions/checkout@v7

      # Log into Azure
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Create Resource Group
      - uses: azure/CLI@v1
        with: 
          inlineScript: |
            az group create --name static_web_storage_group --location francecentral

      
      # Deploy Bicep File 
      - name: Biceps Deploy
        id: deploy
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: static_web_storage_group
          template-file: ./main.bicep
      
      # Verify Outputs
      - name: Print Deployment Outputs
        run: |
          echo "websiteUrl: ${{ steps.deploy.outputs.websiteUrl }}"
          echo "storageAccountName : ${{ steps.deploy.outputs.storageAccountName }}"
      
      # Upload files to blob storage
      - name: Upload to blob storage
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az storage blob upload-batch --account-name ${{steps.deploy.outputs.storageAccountName}} --auth-mode key -d '$web' -s ./dist

      
      # Azure Logout
      - name: logout
        run: |
          az logout
        if: always()


