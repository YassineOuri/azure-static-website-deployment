name: CI with OpenID Connect

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

env:
  RG_Name : static_web_storage_group
  RG_LOCATION: francecentral

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Cypress e2e test
        uses: cypress-io/github-action@v7
        with: 
          build: npm run build
          start: npm start



  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:

      # Checkout Code
      - uses: actions/checkout@v7


      # Download the artifact generated by the build job
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: ./dist

      # Log into Azure
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
    
      # Check Resource Group exists
      - name: Ensure Resource Group Exists
        id: rg_check
        run: |
            exists=$(az group exists --name ${{env.RG_Name}})
            echo "exists=$exists" >> "$GITHUB_OUTPUT"


      # Create Resource Group
      - name: Create Resource Group
        if: steps.rg_check.outputs.exists == 'false'
        run:  az group create --name ${{env.RG_Name}} --location ${{env.RG_LOCATION}}
      
     
      
      # Deploy Bicep File 
      - name: Biceps Deploy
        id: deploy
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{env.RG_Name}}
          template-file: ./main.bicep
      
      # Verify Outputs
      - name: Print Deployment Outputs
        run: |
          echo "websiteUrl: ${{ steps.deploy.outputs.websiteUrl }}"
          echo "storageAccountName : ${{ steps.deploy.outputs.storageAccountName }}"
      
      # Upload files to blob storage
      - name: Upload to blob storage
        run: az storage blob upload-batch --account-name ${{steps.deploy.outputs.storageAccountName}} --auth-mode key -d '$web' -s ./dist --overwrite true

      
      # Azure Logout
      - name: logout
        run: az logout
        if: always()


