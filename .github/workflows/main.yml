
name: CI with OpenID Connect

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

env:
  RG_NAME: static_web_storage_group
  RG_LOCATION: francecentral

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Build project
        working-directory: ./client
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: client/dist/

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Cypress E2E tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: ./client
          start: npm run dev
          wait-on: http://localhost:5173/
          wait-on-timeout: 60

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: ./dist

      - name: Log into Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Resource Group Exists
        id: rg_check
        run: |
          exists=$(az group exists --name "${{ env.RG_NAME }}")
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Create Resource Group
        if: steps.rg_check.outputs.exists == 'false'
        run: |
          az group create \
            --name "${{ env.RG_NAME }}" \
            --location "${{ env.RG_LOCATION }}"

      - name: Deploy Bicep
        id: deploy
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ env.RG_NAME }}
          template-file: ./infra/main.bicep

      - name: Print Deployment Outputs
        run: |
          echo "websiteUrl: ${{ steps.deploy.outputs.websiteUrl }}"
          echo "storageAccountName: ${{ steps.deploy.outputs.storageAccountName }}"
          echo "functionAppEndpoint: ${{ steps.deploy.outputs.functionAppEndpoint }}"
          echo "functionAppName: ${{ steps.deploy.outputs.functionAppName }}"

      - name: Install Function dependencies
        working-directory: ./api
        run: npm ci --omit=dev

      - name: Deploy Backend to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.deploy.outputs.functionAppName }}
          package: ./api

      - name: Upload frontend to Blob Storage
        run: |
          az storage blob upload-batch \
            --account-name "${{ steps.deploy.outputs.storageAccountName }}" \
            --auth-mode key \
            -d '$web' \
            -s ./dist \
            --overwrite true

      - name: Azure Logout
        if: always()
        run: az logout
