name: CI with OpenID Connect

on:
  push:
    branches: [master]
    paths: 
        - 'infra/**'
        - '.github\workflows\infra.yml'

permissions:
  id-token: write
  contents: read

env:
  RG_Name : static_web_storage_group
  RG_LOCATION: francecentral

jobs:
  build:
    runs-on: ubuntu-latest


