<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – Full Name</title>
<style>
:root{
  --bg:#e9edf1; --paper:#ffffff; --ink:#1b2430; --muted:#5b6776; --line:#d8dee5;
  --accent:#0f6e75; --accent-soft:#e3f1f2; --side:#f4f7f9;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0e1319; --paper:#161d26; --ink:#e6ebf0; --muted:#96a3b2; --line:#2a3441;
  --accent:#4fc1c9; --accent-soft:#173238; --side:#1b242f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);display:flex;align-items:center;justify-content:center;padding:24px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{width:100%;max-width:760px;background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden}
header{padding:28px 40px 20px;border-bottom:4px solid var(--accent);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
header strong{font:600 22px var(--serif)}
header span{font:italic 15px var(--serif);color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 220px}
main{padding:40px 40px 44px}
.code{font:600 88px/1 var(--serif);color:var(--accent);letter-spacing:-.02em}
h1{font:600 26px/1.2 var(--serif);margin-top:12px}
p.lead{color:var(--muted);margin-top:10px;max-width:46ch}
.path{margin-top:18px;display:inline-block;max-width:100%;overflow-wrap:anywhere;font:13px ui-monospace,Menlo,Consolas,monospace;
  background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{font:inherit;font-size:14px;padding:9px 18px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0e1319}
aside{background:var(--side);border-left:1px solid var(--line);padding:40px 28px}
aside h2{font:600 17px var(--serif);color:var(--accent);padding-bottom:6px;margin-bottom:12px;border-bottom:1px solid var(--line)}
aside ul{list-style:none}
aside li+li{margin-top:8px}
aside a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:14px}
aside a:hover{color:var(--accent);border-color:var(--accent)}
.ghost{margin-top:26px;display:grid;gap:7px}
.ghost i{display:block;height:6px;border-radius:3px;background:var(--line)}
.ghost i:nth-child(2){width:80%} .ghost i:nth-child(3){width:55%}
.theme{position:fixed;top:14px;right:14px;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
.theme:hover{border-color:var(--accent)}
@media(max-width:640px){
  .grid{grid-template-columns:1fr} aside{border-left:0;border-top:1px solid var(--line);padding:24px 28px}
  main{padding:28px} header{padding:22px 28px 16px} .code{font-size:68px}
}
</style>
</head>
<body>

<button class="theme" id="theme" type="button">Dark mode</button>

<article class="page">
  <header>
    <strong>Full Name</strong>
    <span>Job Title / Professional Headline</span>
  </header>

  <div class="grid">
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>This page could not be found</h1>
      <p class="lead">The link may be broken or the page may have been moved. Check the address, or head back to the resume.</p>
      <code class="path" id="path"></code>
      <div class="ghost" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="actions">
        <a class="btn primary" href="resume.html">View resume</a>
        <button class="btn" id="back" type="button">Go back</button>
      </div>
    </main>

    <aside>
      <h2>Contact</h2>
      <ul>
        <li><a href="mailto:email@example.com">email@example.com</a></li>
        <li><a href="#">linkedin.com/in/username</a></li>
        <li><a href="#">github.com/username</a></li>
        <li><a href="#">yourwebsite.com</a></li>
      </ul>
    </aside>
  </div>
</article>

<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('theme');
  function setTheme(t){root.setAttribute('data-theme',t);btn.textContent=t==='dark'?'Light mode':'Dark mode';}
  setTheme(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  btn.addEventListener('click',function(){setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark');});

  document.getElementById('path').textContent=location.pathname+location.search||'/';
  document.getElementById('back').addEventListener('click',function(){
    if(history.length>1){history.back();}else{location.href='resume.html';}
  });
})();
</script>
</body>
</html>
